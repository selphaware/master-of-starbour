; =============================================================================
; Master of Starbour — controls_config.ini
; =============================================================================
; Every tunable number in the game lives here and nowhere else (BP r111, D-49,
; D-53). The game reads this file at start-up; it never hard-codes a value that
; appears here. Each key cites its row on tab 15 of
; docs/master_of_starbour_blueprint.xlsx (CFG-nn) and the rule it feeds.
;
; Status of each value:
;   Agreed   = Usman's decision (the structure, sometimes the number).
;   Proposed = Claude's placeholder — change it freely; tune by playtest.
; Nothing here is a target. There are no fixed turn counts (D-49).
;
; Format: standard INI read by Python's configparser. Lists are comma-separated.
; Lines starting with ';' are comments; inline comments are not allowed.
; Location: next to the executable when packaged (BR-20); the repo root in dev.
; A test (tests/test_config_matches_blueprint.py) checks every CFG key on tab 15
; is present here, so a missing key fails the gate rather than silently
; defaulting.
; =============================================================================

[world]
; CFG-53 (Proposed) SP-01 — world-generation seed. 'random' = new seed per new
; game, shown on T4 so a run can be repeated; an integer pins the universe.
seed = random
; CFG-54 (Proposed) VW-01…03 — grid dimensions as MxN cells.
universe_size = 8x8
galaxy_size = 16x16
sector_size = 24x24
; CFG-55 (Agreed) GRD-04 — on: sector contents hidden until visited or scanned.
fog_of_war = on
; CFG-56 (Agreed) SP-03 — item density per galaxy.
special_items_per_galaxy = 10
normal_items_per_galaxy = 100
; CFG-57 (Proposed) SP-06 — AI captains generated per galaxy.
ai_captains_per_galaxy = 3
; CFG-58 (Proposed) SP-05 — start sector has a planet and no black hole or
; neutron star.
safe_start = true
; D-71 [ASSUMED] WG-01, WG-02 — share of universe cells that hold a galaxy and
; of galaxy cells that hold a sector; the rest are Void. Not on tab 15 yet.
galaxy_fill_pct = 80
sector_fill_pct = 80
; SP-02 (Agreed) — share of star systems that are binary or triple. [ASSUMED]
; value; the key is named on tab 6 but has no CFG row yet (D-71).
multi_star_pct = 20
; SP-04 (Proposed) - planets per star system, 0..max (D-71).
planets_per_system_max = 3
; D-89 [ASSUMED] SP-07, ST-02...04 - share of sectors holding a black hole or
; neutron star; share of those holes that are neutron stars; share of black
; holes that are wormholes (paired at seeding, SP-01; an odd one stays a plain
; black hole). Not on tab 15 yet.
hole_pct = 15
neutron_pct = 50
wormhole_pct = 30

[bus]
; CFG-59 (Agreed) BUS-03 — ZeroMQ localhost ports: engine PUB, engine PULL.
pub_port = 5555
pull_port = 5556

[ui]
; CFG-60 (Proposed) OB-02 — T3 scrollback.
log_lines = 500
; [ASSUMED] D-68 — glyph set for T2: unicode (★ ◎ ▲ …) or ascii (* @ ^ …) for
; consoles whose font lacks the glyphs. Not on tab 15 yet.
glyph_set = unicode

[movement]
; CFG-22 (Agreed) SH-04, SH-05 — upper bound for engine and warp core.
impulse_max = 10
warp_max = 10
; CFG-23 (Proposed) MV-02 — reach = w × base^((w/10)^exponent); w = 10 = anywhere.
warp_curve_base = 16
warp_curve_exponent = 4

[stellar]
; CFG-12 (Proposed) DQ-03 — temperature = temp_scale × energy^0.25 (kelvin).
temp_scale = 2700
; CFG-13 (Proposed) EB-01 — energy below this = low bucket.
energy_low_max = 5
; CFG-14 (Proposed) EB-02 — energy below this = medium; at or above = high.
energy_medium_max = 100
; CFG-15 (Proposed) DQ-04, SYM-04 — colour thresholds in kelvin; the colour
; list has one more entry than the threshold list (below the first threshold,
; between each pair, above the last). colour_names is the [ASSUMED] companion
; so the names are config too (BP r111).
colour_thresholds = 3700, 5200, 6000, 7500, 10000, 30000
colour_names = red, orange, yellow, yellow-white, white, blue-white, blue
; CFG-16 (Proposed) HZ-04 — pull at distance d = k_g × mass / (1 + d)^falloff.
blackhole_mass = 20
; CFG-17 (Proposed) HZ-06 — as above, weaker.
neutron_mass = 8
; D-89 [ASSUMED] ST-01, DQ-01, DQ-02 - generated stars draw radius and
; base_energy uniformly from these ranges (the tab 7 calculator's examples span
; 0.3..3 and 2..8). Not on tab 15 yet.
radius_min = 0.3
radius_max = 3.0
base_energy_min = 1
base_energy_max = 9

[hazards]
; CFG-18 (Proposed) DQ-05 — gravity constant.
k_g = 1.0
; CFG-19 (Proposed) DQ-05 — pull falloff exponent with distance.
falloff = 1.5
; CFG-20 (Agreed) HZ-02 — turns until pulled in = ceil(scale / pull);
; Sun-like star in its own cell = 7 turns with these defaults.
pull_turns_scale = 7
; CFG-21 (Proposed) HZ-03 — shield drain per turn in a star's cell, by bucket.
drain_low = 5
drain_medium = 10
drain_high = 20

[battle]
; CFG-24 (Proposed) CM-02 — weapon ranges in cells (Chebyshev).
phaser_range = 2
torpedo_range = 5
; CFG-25 (Proposed) CM-03 — torpedo hit chance = base − evade × target engine;
; damage per hit.
torpedo_hit_base = 0.7
torpedo_evade_per_engine = 0.03
torpedo_damage = 25
; CFG-26 (Proposed) CM-04 — phaser damage per power unit at distance 0.
phaser_damage_per_unit = 5
; CFG-27 (Proposed) CM-05 — shield recharge per turn outside battle and hazards.
shield_recharge = 5
; CFG-28 (Proposed) CB-03 — max % of the loser's items and coins transferred
; on peace.
peace_loot_max = 50

[ai]
; CFG-29 (Proposed) CM-10, EF-01 — attack if strength ratio ≥ attack_ratio_min
; and the target's fear < attack_fear_max.
attack_ratio_min = 1.3
attack_fear_max = 50
; CFG-30 (Proposed) CM-10 — offer peace / try to escape below these shield %.
peace_shield_pct = 30
escape_shield_pct = 15
; CFG-31 (Proposed) EF-05 — planets may attack below this respect.
planet_attack_respect_max = 20
; CFG-44 (Proposed) EF-02 — fear at which weaker AI captains surrender their
; ship outright.
yield_fear_min = 80

[fear]
; CFG-01 (Proposed) FR-01 — fear gained for a battle won.
battle_won_delta = 8
; CFG-02 (Proposed) FR-02 — fear lost for a battle lost (AI captains only).
battle_lost_delta = 8
; CFG-03 (Proposed) LV-02 — starting fear (0–100).
start = 10

[respect]
; CFG-04 (Proposed) FR-03 — respect gained for beating a stronger opponent.
win_vs_stronger_delta = 10
; CFG-05 (Proposed) FR-04 — respect lost for beating a weaker opponent who
; offered peace.
win_vs_weaker_peace_delta = 8
; CFG-06 (Proposed) FR-05 — respect lost for beating a weaker opponent in a
; fight you started.
win_vs_weaker_started_delta = 8
; CFG-07 (Proposed) FR-06 — respect lost for starting any fight.
start_fight_delta = 5
; CFG-08 (Proposed) FR-07 — respect gained per accepted trade.
trade_accepted_delta = 3
; CFG-09 (Proposed) FR-08 — respect gained per special item acquired.
special_item_delta = 6
; CFG-10 (Proposed) LV-02 — starting respect (0–100).
start = 10

[reputation]
; CFG-11 (Proposed) LV-03 — clamp on the strength-ratio multiplier applied to
; every fear / respect delta.
scale_min = 0.5
scale_max = 2.0

[economy]
; CFG-32 (Agreed) TR-01 — 1 gold = 20 silver.
silver_per_gold = 20
; CFG-43 (Proposed) EF-03, EF-04 — planets refuse trade below
; planet_refuse_respect; planet prices improve by up to planet_price_band % at
; respect 100; AI captains' terms move by up to respect_price_band %.
planet_refuse_respect = 20
planet_price_band = 20
respect_price_band = 10

[supplies]
; CFG-45 (Proposed) CP-07 — starting supplies; −1 each per turn (SUP-01).
food_start = 30
water_start = 30
; CFG-46 (Proposed) SUP-02 — warn when food or water is at or below this.
warn_turns = 5
; CFG-47 (Proposed) SUP-03 — consecutive turns at 0 before the crew mutiny.
mutiny_turns_at_zero = 3
; CFG-48 (Proposed) SUP-04b — what a demoted captain gets, and the fear hit.
mutiny_ship_class = Kestrel
mutiny_supplies = 10
mutiny_fear_delta = 10

[endgame]
; CFG-49 (Agreed) EG-02, EG-03 — eligibility thresholds (ints 0–100).
respect_min = 90
fear_min = 90
; CFG-50 (Proposed) EG-01 — eligibility wealth threshold in silver-equivalent
; (gold × silver_per_gold + silver).
wealth_min_silver = 2000
; CFG-51 (Proposed) EG-04 — special items needed, one per category.
required_special_categories = 3
; CFG-52 (Proposed) EG-06, CM-13 — Bastion-class guardians at the ultimate item.
guard_ships = 4

[upgrades]
; CFG-33…37 (Agreed structure, Proposed values) UP-01…05, D-53 — which element
; improves which component and by how much, as element:amount pairs. Element
; names are the keys of [elements]. Caps: phasers, engine, warp 10; shields 100;
; torpedoes none.
torpedoes = iridium:4, positronium:10
phasers = osmium:0.5, sunstone:1, adamantine:2
shields = rhodium:5, sapphire:10, orichalcum:25
engine = moonstone:0.5, star_iron:1.5
warp = antihydrogen:0.5, aetherite:1.5

[prices]
; CFG-38 (Agreed structure, Proposed values) PRC-01, PRC-02 — silver per unit;
; buy = what the player pays, sell = what the planet pays.
food_buy = 2
food_sell = 1
water_buy = 2
water_sell = 1
; CFG-39 PRC-03 — torpedoes, silver each.
torpedo_buy = 10
torpedo_sell = 5
; CFG-40 PRC-04 — what a planet pays for an element, as % of its [elements] value.
element_sell_pct = 60
; CFG-41 PRC-05 — ship purchase prices in gold.
ship_kestrel = 40
ship_corsair = 120

[elements]
; CFG-42 (Agreed structure, Proposed values) EL-01…12, D-29, D-53 — one line per
; element: name = category, value (silver), rarity. Effects live in [upgrades]
; only, so each number has one home. Real and mythical names; no franchise
; names (D-03). Categories: precious_metal, exotic_crystal, antimatter, mythical.
iridium = precious_metal, 30, normal
osmium = precious_metal, 40, normal
rhodium = precious_metal, 40, normal
sapphire = exotic_crystal, 60, normal
moonstone = exotic_crystal, 60, normal
sunstone = exotic_crystal, 80, normal
antihydrogen = antimatter, 100, normal
positronium = antimatter, 100, normal
orichalcum = mythical, 400, special
adamantine = mythical, 400, special
aetherite = mythical, 500, special
star_iron = mythical, 500, special

[ships]
; CLS-01…03 (Proposed) — ship classes as torpedoes, phasers, shield_max,
; engine, warp. [ASSUMED] section: tab 9 lists the classes but tab 15 has no CFG
; row for them yet; placing them here keeps 'every number is config' (D-49).
; Names are placeholders for Usman to replace (CLS table note).
kestrel = 6, 3, 60, 4, 3
corsair = 12, 5, 80, 6, 5
bastion = 20, 8, 100, 3, 4
starting_class = kestrel

[captain]
; CP-02, CP-03 (Proposed) — starting coins. [ASSUMED] section for the same
; reason as [ships].
gold_start = 5
silver_start = 50
